<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found — Claims Desk</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --paper: #F2EAD8;
            --paper-card: #FFFCF4;
            --paper-deep: #E7DCC0;
            --ink: #262B3D;
            --ink-soft: #5C6377;
            --kraft: #C6A968;
            --kraft-deep: #9C7B36;
            --stamp-red: #A23B2E;
            --stamp-red-bg: #F3DCD4;
            --stamp-green: #3E6B4A;
            --stamp-green-bg: #DCEAD9;
            --stamp-slate: #4C5878;
            --stamp-slate-bg: #E1E4F1;

            --font-display: 'Zilla Slab', Georgia, 'Times New Roman', serif;
            --font-body: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'IBM Plex Mono', Consolas, 'SFMono-Regular', Menlo, monospace;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: var(--font-body);
            background: var(--paper);
            background-image:
                radial-gradient(circle at 1px 1px, rgba(38,43,61,0.05) 1px, transparent 0);
            background-size: 22px 22px;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { font-family: var(--font-display); color: var(--ink); margin: 0; }

        a { color: inherit; }

        /* ---------- NAV ---------- */
        nav {
            background: var(--ink);
            border-bottom: 4px solid var(--kraft);
            color: #fff;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 66px;
        }

        nav .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.2px; }

        .brand-tag {
            width: 22px; height: 22px;
            background: var(--kraft);
            border-radius: 5px;
            position: relative;
            transform: rotate(-8deg);
            flex-shrink: 0;
        }
        .brand-tag::after {
            content: "";
            position: absolute; top: 4px; left: 4px;
            width: 6px; height: 6px;
            background: var(--ink);
            border-radius: 50%;
        }

        nav .nav-links a {
            color: #D8CDB4;
            text-decoration: none;
            margin-left: 30px;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        nav .nav-links a:hover,
        nav .nav-links a.active { color: #fff; border-bottom-color: var(--kraft); }

        main { max-width: 1040px; margin: 0 auto; padding: 44px 24px 80px; }

        .eyebrow {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--kraft-deep);
            margin-bottom: 6px;
        }

        .page-title { font-size: 30px; font-weight: 700; margin-bottom: 6px; }
        .page-subtitle { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 28px; }

        /* ---------- TICKET HERO (signature element) ---------- */
        .ticket {
            display: flex;
            background: var(--paper-card);
            border: 1px solid var(--kraft);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(38,43,61,0.10);
            margin-bottom: 32px;
            overflow: hidden;
        }
        .ticket-info { flex: 1; padding: 38px 42px; }
        .ticket-info .eyebrow { color: var(--kraft-deep); }
        .ticket-info h1 { font-size: 32px; line-height: 1.2; margin-bottom: 10px; }
        .ticket-info p { color: var(--ink-soft); font-size: 14.5px; line-height: 1.55; max-width: 420px; margin: 0; }

        .ticket-seam { width: 0; border-left: 2px dashed var(--kraft); position: relative; }
        .ticket-seam .notch { position: absolute; width: 22px; height: 22px; background: var(--paper); border-radius: 50%; left: -12px; }
        .ticket-seam .notch-top { top: -12px; }
        .ticket-seam .notch-bottom { bottom: -12px; }

        .ticket-stub {
            width: 270px;
            background: var(--ink);
            color: #fff;
            padding: 34px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .ticket-stub .stub-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 1.5px; color: #C6BFA8; text-transform: uppercase; }
        .ticket-stub .stub-code { font-family: var(--font-mono); font-size: 13px; color: #E9E2CC; }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.2px;
            border: none;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }
        .btn:active { transform: translateY(1px); }

        .btn-primary {
            background: var(--kraft);
            color: var(--ink);
            box-shadow: 0 2px 0 var(--kraft-deep);
        }
        .btn-primary:hover { background: #D3B87A; transform: translateY(-1px); box-shadow: 0 3px 0 var(--kraft-deep); }

        .btn-outline {
            background: transparent;
            color: var(--ink);
            border: 1.5px solid var(--ink);
        }
        .btn-outline:hover { background: var(--ink); color: #fff; }

        .btn-ghost {
            background: transparent;
            color: var(--ink-soft);
            border: 1.5px solid var(--paper-deep);
        }
        .btn-ghost:hover { border-color: var(--ink-soft); color: var(--ink); }

        .btn-danger {
            background: none; border: none; padding: 0;
            color: var(--stamp-red);
            font-family: var(--font-body);
            font-size: 13px; font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* ---------- TAG CHIPS (stats) ---------- */
        .tally-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 34px; }
        .tally-chip {
            position: relative;
            background: var(--paper-card);
            border: 1px solid var(--paper-deep);
            border-radius: 10px;
            padding: 18px 18px 16px;
        }
        .tally-chip::before {
            content: "";
            position: absolute; top: 12px; right: 14px;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--paper);
            border: 1.5px solid var(--paper-deep);
        }
        .tally-num { font-family: var(--font-mono); font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1; }
        .tally-label { margin-top: 6px; font-size: 12px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.6px; }

        /* ---------- CARDS ---------- */
        .card {
            background: var(--paper-card);
            border: 1px solid var(--paper-deep);
            border-top: 4px solid var(--kraft);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(38,43,61,0.06);
            overflow: hidden;
        }
        .card-pad { padding: 30px 34px; }

        /* ---------- LEDGER TABLE ---------- */
        table.ledger { width: 100%; border-collapse: collapse; }
        table.ledger th {
            text-align: left; padding: 13px 20px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--ink-soft); font-weight: 600;
            background: var(--paper-deep);
        }
        table.ledger td { padding: 15px 20px; font-size: 14px; border-bottom: 1px dashed var(--paper-deep); vertical-align: middle; }
        table.ledger tr:last-child td { border-bottom: none; }
        table.ledger tbody tr { transition: background 0.12s ease; }
        table.ledger tbody tr:hover { background: #FBF6E9; }
        table.ledger td.mono, table.ledger .mono { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-soft); }

        /* ---------- STAMP BADGES ---------- */
        .stamp {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1.5px solid currentColor;
            transform: rotate(-3deg);
        }
        .stamp-lost { color: var(--stamp-red); background: var(--stamp-red-bg); }
        .stamp-found { color: var(--stamp-green); background: var(--stamp-green-bg); }
        .stamp-resolved { color: var(--stamp-slate); background: var(--stamp-slate-bg); }

        /* ---------- FORMS ---------- */
        label { display: block; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); text-transform: uppercase; letter-spacing: 0.4px; }

        input, select, textarea {
            padding: 11px 12px;
            border-radius: 7px;
            border: 1.5px solid var(--paper-deep);
            background: #FFFEFA;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--ink);
            width: 100%;
            transition: border-color 0.12s ease, box-shadow 0.12s ease;
        }
        input::placeholder, textarea::placeholder { color: #A9A08A; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--kraft-deep);
            box-shadow: 0 0 0 3px rgba(198,169,104,0.25);
        }
        input[type="file"] { padding: 8px; background: var(--paper-deep); border-style: dashed; }

        .form-row { display: flex; gap: 18px; margin-bottom: 18px; }
        .form-group { flex: 1; }

        /* ---------- MISC ---------- */
        .breadcrumb { font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; }
        .breadcrumb a { text-decoration: none; color: var(--kraft-deep); font-weight: 600; }
        .breadcrumb a:hover { text-decoration: underline; }

        .view-link { color: var(--kraft-deep); text-decoration: none; font-size: 13px; font-weight: 600; }
        .view-link:hover { text-decoration: underline; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); font-size: 14px; }

        .item-photo {
            max-width: 200px; border-radius: 8px; border: 1px solid var(--paper-deep);
            display: block;
        }
        .thumb {
            width: 44px; height: 44px; border-radius: 6px; object-fit: cover;
            border: 1px solid var(--paper-deep); background: var(--paper-deep);
        }
        .thumb-placeholder {
            width: 44px; height: 44px; border-radius: 6px;
            background: var(--paper-deep); display: flex; align-items: center; justify-content: center;
            color: var(--ink-soft); font-size: 16px;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }

        @media (max-width: 720px) {
            .ticket { flex-direction: column; }
            .ticket-seam { display: none; }
            .ticket-stub { width: auto; }
            .tally-row { grid-template-columns: repeat(2, 1fr); }
            .form-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">
        <span class="brand-tag" aria-hidden="true"></span>
        Lost &amp; Found <span style="color:#8B8367; font-weight:500;">— Claims Desk</span>
    </div>
    <div class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'items' %}">Browse Items</a>
        <a href="{% url 'report' %}">Report Item</a>
        {% if user.is_authenticated %}
            <span style="margin-left:30px; color:#8B8367; font-size:13px;">{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" style="background:none; border:none; color:#D8CDB4; font-size:13.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px; cursor:pointer; margin-left:14px; padding:0;">Log Out</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Log In</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
