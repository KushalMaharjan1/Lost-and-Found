{% extends "pages/base.html" %}

{% block content %}

<div class="eyebrow">Amend Claim</div>
<h1 class="page-title">Edit Item</h1>
<p class="page-subtitle">Update the details for this record.</p>

<div class="card">
<div class="card-pad">
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-row">
        <div class="form-group">
            <label>Title *</label>
            <input type="text" name="title" value="{{ item.title }}" required>
        </div>
        <div class="form-group">
            <label>Status *</label>
            <select name="status">
                <option value="LOST" {% if item.status == "LOST" %}selected{% endif %}>Lost</option>
                <option value="FOUND" {% if item.status == "FOUND" %}selected{% endif %}>Found</option>
                <option value="RESOLVED" {% if item.status == "RESOLVED" %}selected{% endif %}>Resolved</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Category</label>
            <select name="category">
                <option value="Electronics" {% if item.category == "Electronics" %}selected{% endif %}>Electronics</option>
                <option value="Jewelry" {% if item.category == "Jewelry" %}selected{% endif %}>Jewelry</option>
                <option value="Documents" {% if item.category == "Documents" %}selected{% endif %}>Documents</option>
                <option value="Clothing" {% if item.category == "Clothing" %}selected{% endif %}>Clothing</option>
                <option value="Keys" {% if item.category == "Keys" %}selected{% endif %}>Keys</option>
                <option value="Accessories" {% if item.category == "Accessories" %}selected{% endif %}>Accessories</option>
                <option value="Other" {% if item.category == "Other" or item.category == "" %}selected{% endif %}>Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Location</label>
            <input type="text" name="location" value="{{ item.location }}">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ item.date }}">
        </div>
        <div class="form-group">
            <label>Contact</label>
            <input type="text" name="contact" value="{{ item.contact }}">
        </div>
    </div>

    <div class="form-group" style="margin-bottom:18px;">
        <label>Description</label>
        <textarea name="description" rows="4">{{ item.description }}</textarea>
    </div>

    <div class="form-group" style="margin-bottom:24px;">
        <label>Photo (optional)</label>
        {% if item.image %}
            <div style="margin-bottom:10px; display:flex; align-items:center; gap:12px;">
                <img src="/media/{{ item.image }}" alt="Current photo" class="item-photo" style="max-width:110px;">
                <span style="font-size:12px; color:var(--ink-soft);">Current photo — choose a new file to replace it.</span>
            </div>
        {% endif %}
        <input type="file" name="image" accept="image/*">
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a class="btn btn-ghost" href="{% url 'detail' item_id %}">Cancel</a>
</form>
</div>
</div>

{% endblock %}
